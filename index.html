<style>

.seg{display:flex;background:var(--in);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:800;padding:9px;border-radius:11px;cursor:pointer}.seg button.on{background:var(--g);color:#fff}
.prem{background:var(--pet);color:#fff;border-radius:22px;padding:18px}.prem p,.prem li{color:#cfe3da}.prem ul{padding-left:0;list-style:none;margin:12px 0}.prem li{margin:9px 0;font-size:15px}.prem li:before{content:"✓ ";color:var(--g);font-weight:900}
.lock{position:relative}.lock>.lk{position:absolute;inset:0;background:color-mix(in srgb,var(--ph) 82%,transparent);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:20px;z-index:2}

svg.map{width:100%;border-radius:20px;background:var(--card)}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{border:1.5px solid var(--ln);background:var(--in);color:var(--tx);border-radius:14px;padding:10px 4px;font:inherit;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;min-height:70px;text-align:center;line-height:1.15;word-break:break-word}.cat span{font-size:22px}.cat.on{background:var(--g);border-color:var(--g);color:#fff}.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--pet);color:#fff;border-radius:14px;padding:12px 14px;z-index:20;font-weight:700}h1,h2,.big,.btn,.tag,.chip,.nav button,.back{font-family:'Poppins','Montserrat',system-ui,sans-serif}.ov2{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:11}.msheet{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--ph);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25)}.msheet input{margin-top:10px}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .mas{background:#e9f6ef;border-radius:28px;padding:6px}}:root[data-theme="dark"] .mas{background:#e9f6ef;border-radius:28px;padding:6px}.logo-d{display:none}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:inline}}:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:inline}.demo.off{display:none!important}.ck{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:13px;margin:12px 0}.ck input{width:22px;height:22px;flex:none;margin-top:2px}.ck a{color:var(--g2)}.bell{background:var(--in);border:0;border-radius:50%;width:42px;height:42px;font-size:20px;position:relative;cursor:pointer}.bell i{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font:700 11px system-ui;border-radius:99px;padding:2px 6px}textarea{resize:none}</style></head>
<body>

<div class="phone" id="app"></div>
<script src="config.js"></script>
<script>
const M={hello:'mascota-hello.png',listen:'mascota-listen.png',map:'mascota-map.png',fist:'mascota-fist.png',win:'mascota-festejo.png',sad:'mascota-preocupada.png'};
const $=s=>document.querySelector(s);
const CFG=window.COPI_CONFIG||{API:''};
const DEMO=!CFG.API||/[?&]demo=1/.test(location.search);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let SES=LS.get('ses')||{};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,CAN_SR=!!SR;
const ERR={codigo_invalido_o_usado:'Ese código no existe o ya se usó.',telefono_ya_registrado:'Ese teléfono ya está registrado. Iniciá sesión.',datos_incorrectos:'Teléfono o código incorrectos.',falta_consentimiento:'Tenés que aceptar para continuar.',offline:'Sin conexión. Probá de nuevo.'};
function err(e){s.err=ERR[e]||e;s.keep=1;const el=$('#er');if(el)el.textContent=s.err}
async function api(b){if(DEMO)return{ok:true,demo:true};
 try{const r=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return await r.json()}
 catch(e){if(['addEntry','event','connection','updateEntry','deleteEntry','addShift','updateShift','deleteShift','updateProfile','setProfile'].includes(b.action)){const q=LS.get('q')||[];q.push(b);LS.set('q',q)}return{ok:false,error:'offline'}}}
function saveRF(){s.rf=s.rf||{};['rc','rn','re','rt','rzo','rk','rk2'].forEach(k=>{const e=$('#'+k);if(e)s.rf[k]=e.type=='checkbox'?e.checked:e.value})}
function restoreRF(){if(s.scr!='register'||!s.rf)return;for(const k in s.rf){const e=$('#'+k);if(e){if(e.type=='checkbox')e.checked=s.rf[k];else e.value=s.rf[k]}}}
const logo=(h=34)=>`<img class="logo-l" src="logo-claro.png" alt="CoPi" style="height:${h}px;width:auto"><img class="logo-d" src="logo-oscuro.png" alt="CoPi" style="height:${h}px;width:auto">`;
const ZONAS=['CABA','GBA zona norte','GBA zona oeste','GBA zona sur','Otra provincia'];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sug=()=>Math.round((+s.est)*1.1/1000)*1000;
const saveProf=()=>{saveLocal();return api({action:'setProfile',userId:SES.uid,codigo:SES.code,cuenta:s.obq||'',estimado:s.est||'',meta:s.meta||''})};
const saveProfile=()=>{saveLocal();return api({action:'updateProfile',userId:SES.uid,codigo:SES.code,nombre:s.fullname,correo:s.email,trabajo:s.work,vehiculo:s.veh||'',apps:s.apps,zona:s.zona,agregados:!!s.agr,gastos_fijos:JSON.stringify(s.fx||{}),meta:s.meta||'',estimado:s.est||'',cuenta:s.obq||''})};
function saveLocal(){if(!SES.uid)return;LS.set('prof_'+SES.uid,{fullname:s.fullname,email:s.email,work:s.work,veh:s.veh,apps:s.apps,zona:s.zona,meta:s.meta,est:s.est,obq:s.obq,agr:s.agr,fx:s.fx})}
function applyLocal(){const p=(SES.uid&&LS.get('prof_'+SES.uid))||{};for(const k in p)if(p[k]!==undefined&&p[k]!==null)s[k]=p[k];s.fx=normFx(s.fx);if(s.fullname)s.name=s.fullname.split(' ')[0]}
function autoNt(){const a=[],hr=new Date().getHours();
 if(!s.meta)a.push({id:'auto-meta',titulo:'Definí tu meta semanal',texto:'Con una meta vas a ver cuánto te falta para llegar.'});
 if(fxPend().length)a.push({id:'auto-fx-'+ym(),titulo:'Revisá tus gastos fijos de '+mname(),texto:'Fijate si cambió algún monto y cargalos en un toque.'});
 if(hr>=19&&!s.ent.some(e=>e.d==key(today)))a.push({id:'auto-carga-'+key(today),titulo:'Hoy todavía no cargaste nada',texto:'Sumá tus ingresos y gastos del día para que los totales sean reales.'});
 return a}
async function loadNt(){const r=await api({action:'notifs',userId:SES.uid,codigo:SES.code});s.ntl=[...autoNt(),...((r&&r.items)||[])]}
async function loadShifts(){const r=await api({action:'getShifts',userId:SES.uid,codigo:SES.code});if(r&&r.shifts)s.shifts=r.shifts.map(x=>({id:x.id,ini:new Date(x.inicio).getTime(),fin:new Date(x.fin).getTime(),min:+x.minutos,d:x.fecha}))}
const OCRERR=e=>!e?'No encontré un monto en el comprobante. Cargalo a mano.':e=='falta_ANTHROPIC_KEY'?'La lectura con IA todavía no está configurada (falta la clave).':/^ia_error_401/.test(e)?'La clave de IA no es válida.':/^ia_error_(400|404)/.test(e)?'El modelo de IA no está disponible. Avisá al equipo.':e=='offline'?'Sin conexión. Probá de nuevo.':e=='no_autorizado'?'Tu sesión venció. Volvé a iniciar sesión.':e=='archivo_grande'?'El archivo es muy grande.':'No pude leerlo ('+e+'). Cargalo a mano.';
const unread=()=>(s.ntl||[]).filter(n=>!(LS.get('read')||[]).includes(n.id)).length;
function markRead(){LS.set('read',(s.ntl||[]).map(n=>n.id))}
async function flush(){const q=LS.get('q')||[];if(!q.length||DEMO)return;LS.set('q',[]);for(const b of q)await api(b)}
const ev=(e,d)=>SES.uid?api({action:'event',userId:SES.uid,codigo:SES.code,evento:e,detalle:d||''}):0;
async function load(){const r=await api({action:'getEntries',userId:SES.uid,codigo:SES.code});if(r.ok&&r.entries)s.ent=r.entries.map(e=>({t:e.tipo,c:LEG[e.categoria]||e.categoria,a:+e.monto,d:String(e.fecha).slice(0,10),id:e.id,n:e.nota}))}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
const shrink=f=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=no;im.src=u});
function norm(t){const W={un:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100};
 return t.toLowerCase().replace(/(\d{1,3})(?:[\s\u00a0\u202f]*[.,][\s\u00a0\u202f]*|[\s\u00a0\u202f]+)(\d{3})(?!\d)/g,'$1$2').replace(/(\d{1,3})(?:[\s\u00a0\u202f]*[.,][\s\u00a0\u202f]*|[\s\u00a0\u202f]+)(\d{3})(?!\d)/g,'$1$2').replace(/\b(un|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince|veinte|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento)\s+(mil)\b/g,(m,a)=>W[a]+' mil')}
function pdate(t){let x=String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),d=null,m;
 const W={un:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7},cut=r=>{x=x.replace(r,' ')},MS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
 if(m=x.match(/\bhace (\d{1,2}|un|dos|tres|cuatro|cinco|seis|siete) dias?\b/)){d=addD(today,-(W[m[1]]||+m[1]));cut(m[0])}
 else if(m=x.match(/\b(anteayer|antes de ayer|antier)\b/)){d=addD(today,-2);cut(m[0])}
 else if(m=x.match(/\bayer\b/)){d=addD(today,-1);cut(m[0])}
 else if(m=x.match(/\bhoy\b/)){d=today;cut(m[0])}
 else if(m=x.match(/\b(?:el |este |del )?(domingo|lunes|martes|miercoles|jueves|viernes|sabado)(?: pasado)?\b/)){const w={domingo:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6}[m[1]];let b=(today.getDay()-w+7)%7;if(b==0)b=7;d=addD(today,-b);cut(m[0])}
 else if(m=x.match(/\bel (?:dia )?(\d{1,2})(?! ?(?:mil|k|lucas)\b)(?: de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre))?\b/)){
  const dd=+m[1];let y=today.getFullYear(),mo=m[2]?MS.indexOf(m[2]):today.getMonth();
  if(m[2]){if(new Date(y,mo,dd,12)>today)y--}else if(dd>today.getDate()){mo--;if(mo<0){mo=11;y--}}
  const c=new Date(y,mo,dd,12);if(dd>=1&&c.getDate()==dd){d=c;cut(m[0])}}
 return{d:d?key(d):null,rest:x.replace(/\s+/g,' ').trim()}}
function lp(t){const x=norm(t),m=x.match(/(\d+(?:[.,]\d+)?)\s*(mil|k|lucas)?/);if(!m)return null;
 const n=m[1];let a=/^\d{1,3}(\.\d{3})+$/.test(n)?+n.replace(/\./g,''):parseFloat(n.replace(',','.'));if(m[2]&&a<1000)a*=1000;
 const inc=/cobr|pagaron|dieron|ingres|gan[eé]|propina|bono|incentivo|premio|recompensa/.test(x)&&!/gast|puse|compr|pagu[eé]/.test(x);
 const c=inc?(/propina/.test(x)?'Propina':/bono|incentivo|premio|recompensa/.test(x)?'Bono':/aparte|efectivo/.test(x)?'Cobro aparte':'Cobro de app'):/nafta|combustible|gnc|gasoil|carg[uú]e/.test(x)?'Combustible':/seguro/.test(x)?'Seguro':/monotributo|impuesto|afip|arca/.test(x)?'Impuestos':/alquiler|cuota/.test(x)?'Alquiler o cuota':/celular|datos|internet|recarga/.test(x)?'Celular':/casco|mochila|campera|equipamiento|guantes/.test(x)?'Equipamiento':/estacion|peaje|garage|cochera/.test(x)?'Peajes y estac.':/comida|com[ií]|almuerzo|caf[eé]|cena/.test(x)?'Comida':/limpi|lav/.test(x)?'Limpieza':/arreglo|taller|mec[aá]nic|service|cubierta|rueda|aceite|repar/.test(x)?'Mantenimiento':'Otro';
 return{t:inc?'inc':'exp',c,a}}
const num=v=>+String(v==null?'':v).replace(/\D/g,'')||0;
const fmtN=v=>{const n=num(v);return n?n.toLocaleString('es-AR'):''};
document.addEventListener('input',e=>{const t=e.target;if(!t.classList||!t.classList.contains('money'))return;const L=t.value.length,p=t.selectionStart;t.value=fmtN(t.value);const q=Math.max(0,(p||0)+t.value.length-L);try{t.setSelectionRange(q,q)}catch(x){}});
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');

 const it=[{t:'inc',ic:'💵',c:'Cobro de app',a:Math.round(inc*.86)},{t:'inc',ic:'🙌',c:'Propina',a:inc-Math.round(inc*.86)},

 if(s.edit){const e=s.ent.find(x=>x.id==s.edit);if(e){Object.assign(e,{t:f.t,c:f.c,a:+f.a,d:fd,n:f.n,ic:[...INC,...EXP,...s.newCats.inc,...s.newCats.exp].find(x=>x[1]==f.c)?.[0]||'💬'});
  api({action:'updateEntry',userId:SES.uid,codigo:SES.code,id:e.id,tipo:f.t,categoria:f.c,grupo:grp(f.c),monto:+f.a,fecha:fd,nota:f.n})}
  s.edit=null;s.delAsk=0;s.f={t:'exp',c:defExp(),a:'',n:''};s.scr='app';s.tab='act';s.toast='Cambios guardados';return}
 entry(f.t,f.c,f.a,fd,undefined,f.n);s.f={t:'exp',c:defExp(),a:'',n:''};s.scr='app';s.tab='act';s.range='day';const i=Math.round((new Date(fd+'T12:00')-mon)/864e5);s.day=i>=0&&i<7?i:Math.round((today-mon)/864e5)},

ocr:()=>$('#fl').click(),
rec:()=>{const e=$('#vt');if(e)s.vt=e.value;if(s.rec&&window._sr){window._sr.stop();return}s.err='';s.mic=null;startRec()},
parse:async()=>{const tv=$('#vt');s.vt=(tv?tv.value:(s.vt||'')).trim();s.err='';if(!s.vt){s.err='Escribí o dictá algo primero.';return}
 const pd=pdate(s.vt);let d=null;if(!DEMO){const r=await api({action:'parse',userId:SES.uid,codigo:SES.code,texto:norm(pd.rest)});if(r.ok&&r.data&&r.data.monto)d={t:r.data.tipo,c:LEG[r.data.categoria]||r.data.categoria,a:r.data.monto}}
 if(!d)d=lp(pd.rest);if(!d){s.err='No encontré un monto. Probá: “Gasté 3500 en comida”.';return}
 s.org='voz';s.mic={ph:2,tx:s.vt,...d,fd:pd.d}},
talk:()=>{s.mic={ph:1};render();const ex=[['Puse 15 mil de nafta','exp','Combustible',15000],['Me dieron 2 mil de propina','inc','Propina',2000],['Gasté 3500 en comer','exp','Comida',3500]],e=ex[Math.floor(Math.random()*3)];setTimeout(()=>{s.mic={ph:2,tx:e[0],t:e[1],c:e[2],a:e[3]};render()},1800)},
mconf:()=>{const m=s.mic;s.vt='';entry(m.t,m.c,m.a,m.fd||undefined,undefined,m.tx);s.mic=null;s.scr='app';s.tab='home'},

};
function startRec(){if(!CAN_SR)return;s.vt='';const id=s.rid=(s.rid||0)+1;let got='';
 const r=new SR();window._sr=r;r.lang='es-AR';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;s.rec=true;
 r.onresult=e=>{if(s.rid!=id)return;got=Array.from(e.results).map(x=>x[0].transcript).join(' ').trim();s.vt=got;const t=$('#vt');if(t)t.value=got};
 r.onerror=e=>{if(s.rid!=id||e.error=='no-speech'||e.error=='aborted')return;s.err=(e.error=='not-allowed'||e.error=='service-not-allowed')?'Tenés que permitir el micrófono en tu navegador. Mientras tanto, escribilo.':e.error=='network'?'Sin conexión para el dictado. Escribilo o probá de nuevo.':'No pude usar el micrófono. Escribilo o usá el micrófono de tu teclado.'};
 r.onend=async()=>{if(s.rid!=id)return;s.rec=false;if(s.scr=='mic'){if(got&&!s.err)await A.parse();else if(!got&&!s.err)s.err='No te escuché. Tocá “Hablar” y probá de nuevo.'}render()};
 try{r.start()}catch(x){s.rec=false;s.err='No pude usar el micrófono. Escribilo.'}}
function keep(){const g=i=>$(i);if(g('#fa'))s.f.a=num(g('#fa').value)||'';if(g('#fn'))s.f.n=g('#fn').value}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();if(s.scr=='register')saveRF();if(t.dataset.a=='plusx'&&e.target.closest('.fab'))return;const[k,...r]=t.dataset.a.split(':');if(A[k]){const x=A[k](r.join(':'));if(x&&x.then)x.then(()=>{if(s.keep)s.keep=0;else render()});else render()}});
document.addEventListener('change',async e=>{if(!OCR_ON||e.target.id!='fl'||!e.target.files[0])return;const f=e.target.files[0];e.target.value='';keep();
 if(DEMO){s.f={t:'exp',c:'Combustible',a:18500,n:'Leído de tu comprobante (simulado). Revisá y confirmá.'};render();return}
 s.toast='Leyendo tu comprobante…';render();
 try{const pdf=f.type=='application/pdf';let data,mime;
  if(pdf){if(f.size>4e6)throw{error:'archivo_grande'};data=await b64(f);mime='application/pdf'}else{data=await shrink(f);mime='image/jpeg'}
  const r=await api({action:'ocr',userId:SES.uid,codigo:SES.code,image:data,mime});
  if(!r.ok||!r.data||!r.data.monto)throw r;const d=r.data;
  s.f={t:d.tipo,c:d.categoria,a:d.monto,n:(d.nota||'')+' (leído de tu comprobante: revisá y confirmá)',d:d.fecha||undefined};s.org='ocr';s.toast='Listo, revisá los datos.'}
 catch(x){s.toast=OCRERR(x&&x.error)}
 render()});

if(!DEMO&&SES.uid){s.scr='app';s.name=(SES.name||s.name).split(' ')[0];s.meta=SES.meta||0;s.fullname=SES.name||'';applyLocal()}
