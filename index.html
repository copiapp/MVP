<body>

<div class="phone" id="app"></div>
<script src="config.js"></script>
<script>
const M={hello:'mascota-hello.png',listen:'mascota-listen.png',map:'mascota-map.png',fist:'mascota-fist.png',win:'mascota-festejo.png',sad:'mascota-preocupada.png'};
const $=s=>document.querySelector(s);
const CFG=window.COPI_CONFIG||{API:''};
const DEMO=!CFG.API||/[?&]demo=1/.test(location.search);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let SES=LS.get('ses')||{};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,CAN_SR=!!SR;
const ERR={codigo_invalido_o_usado:'Ese código no existe o ya se usó.',telefono_ya_registrado:'Ese teléfono ya está registrado. Iniciá sesión.',datos_incorrectos:'Teléfono o código incorrectos.',falta_consentimiento:'Tenés que aceptar para continuar.',offline:'Sin conexión. Probá de nuevo.'};
function err(e){s.err=ERR[e]||e;s.keep=1;const el=$('#er');if(el)el.textContent=s.err}
async function api(b){if(DEMO)return{ok:true,demo:true};
 try{const r=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return await r.json()}
 catch(e){if(['addEntry','event','connection','updateEntry','deleteEntry','addShift','updateShift','deleteShift','updateProfile','setProfile'].includes(b.action)){const q=LS.get('q')||[];q.push(b);LS.set('q',q)}return{ok:false,error:'offline'}}}
function saveRF(){s.rf=s.rf||{};['rc','rn','re','rt','rzo','rk','rk2'].forEach(k=>{const e=$('#'+k);if(e)s.rf[k]=e.type=='checkbox'?e.checked:e.value})}
function restoreRF(){if(s.scr!='register'||!s.rf)return;for(const k in s.rf){const e=$('#'+k);if(e){if(e.type=='checkbox')e.checked=s.rf[k];else e.value=s.rf[k]}}}
const logo=(h=34)=>`<img class="logo-l" src="logo-claro.png" alt="CoPi" style="height:${h}px;width:auto"><img class="logo-d" src="logo-oscuro.png" alt="CoPi" style="height:${h}px;width:auto">`;
const ZONAS=['CABA','GBA zona norte','GBA zona oeste','GBA zona sur','Otra provincia'];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sug=()=>Math.round((+s.est)*1.1/1000)*1000;
const saveProf=()=>{saveLocal();return api({action:'setProfile',userId:SES.uid,codigo:SES.code,cuenta:s.obq||'',estimado:s.est||'',meta:s.meta||''})};
const saveProfile=()=>{saveLocal();return api({action:'updateProfile',userId:SES.uid,codigo:SES.code,nombre:s.fullname,correo:s.email,trabajo:s.work,vehiculo:s.veh||'',apps:s.apps,zona:s.zona,agregados:!!s.agr,gastos_fijos:JSON.stringify(s.fx||{}),meta:s.meta||'',estimado:s.est||'',cuenta:s.obq||''})};
function saveLocal(){if(!SES.uid)return;LS.set('prof_'+SES.uid,{fullname:s.fullname,email:s.email,work:s.work,veh:s.veh,apps:s.apps,zona:s.zona,meta:s.meta,est:s.est,obq:s.obq,agr:s.agr,fx:s.fx})}
function applyLocal(){const p=(SES.uid&&LS.get('prof_'+SES.uid))||{};for(const k in p)if(p[k]!==undefined&&p[k]!==null)s[k]=p[k];s.fx=normFx(s.fx);if(s.fullname)s.name=s.fullname.split(' ')[0]}
function autoNt(){const a=[],hr=new Date().getHours();
 if(!s.meta)a.push({id:'auto-meta',titulo:'Definí tu meta semanal',texto:'Con una meta vas a ver cuánto te falta para llegar.'});
 if(fxPend().length)a.push({id:'auto-fx-'+ym(),titulo:'Revisá tus gastos fijos de '+mname(),texto:'Fijate si cambió algún monto y cargalos en un toque.'});
 if(hr>=19&&!s.ent.some(e=>e.d==key(today)))a.push({id:'auto-carga-'+key(today),titulo:'Hoy todavía no cargaste nada',texto:'Sumá tus ingresos y gastos del día para que los totales sean reales.'});
 return a}
async function loadNt(){const r=await api({action:'notifs',userId:SES.uid,codigo:SES.code});s.ntl=[...autoNt(),...((r&&r.items)||[])]}
async function loadShifts(){const r=await api({action:'getShifts',userId:SES.uid,codigo:SES.code});if(r&&r.shifts)s.shifts=r.shifts.map(x=>({id:x.id,ini:new Date(x.inicio).getTime(),fin:new Date(x.fin).getTime(),min:+x.minutos,d:x.fecha}))}
const OCRERR=e=>!e?'No encontré un monto en el comprobante. Cargalo a mano.':e=='falta_ANTHROPIC_KEY'?'La lectura con IA todavía no está configurada (falta la clave).':/^ia_error_401/.test(e)?'La clave de IA no es válida.':/^ia_error_(400|404)/.test(e)?'El modelo de IA no está disponible. Avisá al equipo.':e=='offline'?'Sin conexión. Probá de nuevo.':e=='no_autorizado'?'Tu sesión venció. Volvé a iniciar sesión.':e=='archivo_grande'?'El archivo es muy grande.':'No pude leerlo ('+e+'). Cargalo a mano.';
const unread=()=>(s.ntl||[]).filter(n=>!(LS.get('read')||[]).includes(n.id)).length;
function markRead(){LS.set('read',(s.ntl||[]).map(n=>n.id))}
async function flush(){const q=LS.get('q')||[];if(!q.length||DEMO)return;LS.set('q',[]);for(const b of q)await api(b)}
const ev=(e,d)=>SES.uid?api({action:'event',userId:SES.uid,codigo:SES.code,evento:e,detalle:d||''}):0;
async function load(){const r=await api({action:'getEntries',userId:SES.uid,codigo:SES.code});if(r.ok&&r.entries)s.ent=r.entries.map(e=>({t:e.tipo,c:LEG[e.categoria]||e.categoria,a:+e.monto,d:String(e.fecha).slice(0,10),id:e.id,n:e.nota}))}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});

register:()=>`<div class="scr"><button class="back" data-a="go:welcome">← Volver</button><h1>Registrate</h1><label>Código de invitación</label><input id="rc" autocapitalize="characters" placeholder="PILOTO-001"><label>Nombre</label><input id="rn"><label>Correo</label><input id="re" type="email" inputmode="email"><label>N° de teléfono</label><input id="rt" type="tel" inputmode="tel"><label>Sobre tu trabajo</label><div class="chips">${['Repartidor','Conductor','Ambos'].map(w=>`<button class="chip ${s.work==w?'on':''}" data-a="work:${w}">${w}</button>`).join('')}</div><label>¿Qué vehículo usás?</label><div class="chips">${['Moto','Bicicleta','Auto','Otro'].map(v=>`<button class="chip ${s.veh==v?'on':''}" data-a="veh:${v}">${v}</button>`).join('')}</div><label>¿Con qué apps trabajás?</label><div class="chips">${ALL.map(a=>`<button class="chip ${s.apps.includes(a)?'on':''}" data-a="app:${a}">${a}</button>`).join('')}</div><label>¿En qué zona trabajás?</label><div class="chips">${ZONAS.map(z=>`<button class="chip ${s.zona==z?'on':''}" data-a="zona:${z}">${z}</button>`).join('')}</div>${s.zona=='Otra provincia'?'<input id="rzo" placeholder="¿Cuál?" style="margin-top:8px">':''}
<label class="ck"><input id="rk" type="checkbox"><span>Acepto los <a href="#" data-a="go:tyc">Términos y condiciones</a> y la <a href="#" data-a="go:priv">Política de privacidad</a>.</span></label>
<label class="ck"><input id="rk2" type="checkbox"><span>Acepto (opcional) que CoPi use mis datos de forma agregada y anónima para estudios del sector.</span></label>
<p id="er" style="color:#ef4444">${s.err||''}</p><button class="btn" data-a="reg">Crear cuenta</button></div>`,
ob:()=>{const st=s.obs,body=st==0?`<h1>Una pregunta rápida</h1><p>¿Llevás la cuenta de cuánto ganás por semana?</p><div class="chips" style="margin-top:12px"><button class="chip" data-a="obq:si">Sí</button><button class="chip" data-a="obq:no">No</button></div>`
 :st==1?`<h1>¿Cuánto estimás que ganás por semana?</h1><p>Un número aproximado alcanza.</p><label>Ganancia semanal estimada ($)</label><input id="oe" type="text" inputmode="numeric" class="money" autocomplete="off" value="${fmtN(s.est)}"><button class="btn" data-a="obest">Continuar</button>`
 :`<h1>Tu meta semanal</h1><p>${s.est?`Te sugerimos <b style="color:var(--tx)">${fmt(sug())}</b> (un 10% más de lo que estimás). Podés cambiarla.`:'¿Cuánto querés ganar por semana?'}</p><label>Meta semanal ($)</label><input id="om" type="text" inputmode="numeric" class="money" autocomplete="off" value="${fmtN(s.meta||(s.est?sug():''))}"><button class="btn" data-a="obmeta">Guardar meta</button>${s.est?'':'<button class="lnk" data-a="obq:si">Ayudame a calcularla</button>'}`;
 return `<div class="scr">${mas('hello',110)}${body}<button class="lnk" data-a="obskip">Saltear</button><p class="mu" style="text-align:center">Podés cambiarlo cuando quieras desde tu perfil.</p></div>`},
tyc:()=>`<div class="scr"><button class="back" data-a="go:register">← Volver</button><h1>Términos y condiciones</h1><span class="tag">BORRADOR · a revisar por un profesional</span><h2>1. Qué es CoPi</h2><p>Una herramienta para registrar y organizar tus ingresos y gastos. No es asesoramiento financiero, contable ni impositivo.</p><h2>2. Piloto</h2><p>Esta es una versión de prueba: puede cambiar o interrumpirse. Tu código de acceso es personal e intransferible.</p><h2>3. Tus datos</h2><p>Tenés que cargar información veraz y cuidar tu código.</p><h2>4. Plataformas</h2><p>CoPi no pertenece ni está afiliada a Rappi, PedidosYa, Uber, DiDi, Cabify ni otras apps.</p><h2>5. Baja</h2><p>Podés pedir la baja y el borrado de tus datos escribiendo desde Ayuda.</p><h2>6. Contacto</h2><p>[completar]</p></div>`,
priv:()=>`<div class="scr"><button class="back" data-a="go:register">← Volver</button><h1>Política de privacidad</h1><span class="tag">BORRADOR · a revisar por un profesional</span><h2>Qué datos guardamos</h2><p>Nombre, correo, teléfono, zona, trabajo y apps; tus ingresos y gastos; tu estimación y meta semanal; tus mensajes de ayuda y datos de uso de la app.</p><h2>Para qué</h2><p>Para que la app funcione, mejorarla y comunicarnos con vos. Si lo aceptás, también para estudios agregados y anónimos del sector.</p><h2>Con quién se procesan</h2><p>Los datos se guardan en servicios de Google. Para interpretar textos y comprobantes usamos un proveedor de inteligencia artificial: se envía el texto o la imagen para leerlo, y no guardamos la imagen. Si usás el dictado por voz, el audio lo transcribe el servicio de voz de tu navegador (en Chrome, Google).</p><h2>Tus derechos</h2><p>Podés pedir acceso, corrección o borrado de tus datos. La Agencia de Acceso a la Información Pública es el órgano de control de la Ley 25.326.</p><h2>Contacto</h2><p>[completar]</p></div>`,
notifs:()=>`<div class="scr"><button class="back" data-a="x">← Volver</button><h1>Notificaciones</h1>${(s.ntl||[]).length?s.ntl.map(n=>`<div class="card w"><b>${esc(n.titulo)}</b><p>${esc(n.texto)}</p></div>`).join(''):'<p>No tenés notificaciones.</p>'}</div>`,
help:()=>`<div class="scr"><button class="back" data-a="x">← Volver</button><h1>Ayuda</h1>${[['Primeros pasos','Cómo registrarte y empezar'],['Cargar ingresos y gastos','Manual, por texto o con foto'],['Mi cuenta y mis datos','Qué guardamos y cómo borrarlo']].map(([t,d])=>`<div class="card w"><b>${t}</b><p>${d}</p><span class="tag">Próximamente</span></div>`).join('')}<h2>¿Necesitás ayuda?</h2><p>Escribinos y te respondemos.</p><textarea id="hm" rows="4" placeholder="Contanos qué pasó…" style="margin-top:8px">${esc(s.hm)}</textarea><p style="color:#ef4444">${s.err||''}</p><button class="btn" data-a="helpsend">Enviar</button></div>`,
home:()=>{const n=[0,1,2,3,4,5,6].reduce((a,i)=>a+sum(day(addD(mon,i))).n,0),m=s.meta,pc=m?Math.max(0,Math.min(100,Math.round(n/m*100))):0,u=unread();
 return `<div class="scr"><div class="row">${logo(30)}<button class="bell" data-a="nt" aria-label="Notificaciones">🔔${u?`<i>${u}</i>`:''}</button></div>
<div class="card"><div class="row"><div><b>Tu ganancia neta semanal</b><div class="big" style="${n<0?'color:#ef4444':''}">${fmt(n)}</div></div>${mas(n<0?'sad':(m&&pc>=100?'win':'hello'),92)}</div>${m?`<div class="bar"><i style="width:${pc}%"></i></div><div class="row mu"><span>${n<0?'Tus gastos superan tus ingresos':pc>=100?'¡Meta cumplida! 🎉':pc+'% completado'}</span><button class="lnk" style="width:auto;padding:0" data-a="meditor">Meta ${fmt(m)} ✎</button></div>`:`<button class="btn sm" data-a="meditor" style="margin-top:8px">Definir mi meta semanal</button>`}</div>
${fxCard()}<div class="card w"><b>Tus ganancias por día (semana)</b>${bars([0,1,2,3,4,5,6].map(i=>sum(day(addD(mon,i))).n),DN)}</div>
<div class="card w row"><div><b>Horas esta semana</b><div class="mu">${hrs()}${s.since?' · en curso desde las '+new Date(s.since).toTimeString().slice(0,5):''}</div></div><button class="btn sm ${s.since?'r':''}" data-a="clock">${s.since?'Terminé':'Empecé a trabajar'}</button></div>
<div class="card w row" ${OCR_ON?'data-a="doc" style="cursor:pointer"':'style="opacity:.6"'}><span>📷 <b>Subí una foto de tu comprobante</b><div class="mu">y llevá un registro de tus ingresos</div></span>${OCR_ON?'›':'<span class="tag">Próximamente</span>'}</div></div>`},
act:()=>{const p=period(),r=s.range,mo=['Este mes','Mes anterior','Hace 2 meses'];
 return `<div class="scr"><h1>Actividad</h1><div class="seg">${[['day','Día'],['week','Semana'],['month','Mes']].map(([k,l])=>`<button class="${r==k?'on':''}" data-a="rg:${k}">${l}</button>`).join('')}</div>
 ${r=='day'?`<div class="chips" style="margin-bottom:10px">${DN.map((d,i)=>`<button class="chip ${s.day==i?'on':''}" data-a="dy:${i}">${d}</button>`).join('')}</div>`:''}
 ${r=='month'?`<div class="chips" style="margin-bottom:10px">${mo.map((d,i)=>`<button class="chip ${s.mo==i?'on':''}" data-a="mo:${i}">${d}</button>`).join('')}</div>`:''}
 <div class="card"><div class="row mu"><span>Ingresos <b class="pos">${fmt(p.i)}</b></span><span>Gastos <b class="neg">${fmt(p.e)}</b></span></div><div class="mu" style="margin-top:6px">Neto</div><div class="big" style="${p.n<0?'color:#ef4444':''}">${fmt(p.n)}</div></div>
 ${p.bars?`<div class="card w">${bars(p.bars,p.labels)}</div>`:''}<h2>Movimientos</h2>${p.it.map(x=>`<div class="li"${x.id?` data-a="ed:${x.id}" style="cursor:pointer"`:''}><div class="ic">${x.ic||[...INC,...EXP,...s.newCats.inc,...s.newCats.exp].find(c=>c[1]==x.c)?.[0]||'💬'}</div><div>${esc(x.c)}${x.n?`<div class="mu">${esc(x.n)}</div>`:''}</div><span class="${x.t=='inc'?'pos':'neg'}">${x.t=='inc'?'+':'-'}${fmt(x.a)}</span>${x.id?'<span class="mu">›</span>':''}</div>`).join('')}</div>`},
cop:()=>{const M=copGet(),head=`<div class="row" style="margin-bottom:10px"><div><h1>Copiloto</h1><p>Tu proyección y qué te conviene hacer.</p></div><div class="bulbic">${BULB}</div></div>`;
 if(!M.ok)return `<div class="scr">${head}<div class="card" style="text-align:center">${mas('hello',120)}<b>Estoy conociendo tu ritmo</b><p>Para proyectar y recomendarte necesito al menos una semana tuya, con ingresos cargados en 3 días o más.</p><div class="bar"><i style="width:${Math.min(100,Math.round(M.days/7*100))}%"></i></div><div class="mu">${Math.min(M.days,7)} de 7 días · ${M.worked} con ingresos</div><button class="btn" data-a="m:doc">Cargar un ingreso</button></div></div>`;
 const R=M.rec,H=s.cph||30,B=M.base,P=M.plan,meta=s.meta||0,lb={14:'2 semanas',30:'1 mes',91:'3 meses'}[H],dl=P.p50[H]-B.p50[H],avg=M.mu.reduce((a,b)=>a+b,0)/7,up=Math.round((M.mu[R.best]/avg-1)*100),dn=Math.round((1-M.mu[R.worst]/avg)*100);
 const ins=[];if(up>=5)ins.push(`Los <b>${dp(R.best)}</b> son tu mejor día: rinden un ${up}% más que tu promedio.`);else ins.push('Tus días rinden parecido entre sí: lo que más suma es la cantidad de horas.');
 if(dn>=8)ins.push(`Los <b>${dp(R.worst)}</b> son los más flojos (${dn}% menos que tu promedio): ideales para descansar.`);
 ins.push(`Tu neto ronda <b>${fmt(M.mu0/M.hT)}</b> por hora${M.real?'':' (estimado con una jornada típica de '+String(M.hT).replace('.',',')+' h; cargá tus jornadas para afinarlo)'}.`);
 if(M.nb>=4&&Math.abs(M.g)>=.005)ins.push(`Tus últimas semanas vienen ${M.g>0?'subiendo':'bajando'} ~${Math.round(Math.abs(M.g)*100)}% por semana (lo tenemos en cuenta, pero amortiguado).`);
 const hs=String(R.h).replace('.',','),mc={meta:`Para llegar a tu meta de ${fmt(meta)} por semana`,mejor:'Ya venís cumpliendo tu meta: el mismo esfuerzo, pero en tus mejores días',libre:'Para sacarle más a tu semana'}[R.mode];
 return `<div class="scr">${head}
<div class="card w"><b>Si seguís trabajando así…</b>
<div class="seg" style="margin:10px 0 8px">${[[14,'2 semanas'],[30,'1 mes'],[91,'3 meses']].map(([k,l])=>`<button class="${H==k?'on':''}" data-a="cph:${k}">${l}</button>`).join('')}</div>
<div class="mu">En ${lb} vas a llegar a unos</div><div class="big" style="${B.p50[H]<0?'color:#ef4444':''}">${fmt(B.p50[H])}</div><div class="mu">de ganancia neta · en pesos de hoy</div>
<div id="pjt" class="mu" style="margin:8px 0 2px;min-height:15px">8 de cada 10 escenarios caen entre <b style="color:var(--tx)">${fmtK(B.p10[H])}</b> y <b style="color:var(--tx)">${fmtK(B.p90[H])}</b>. Deslizá el dedo por el gráfico.</div>
${pjChart(M,H)}
<div class="lg"><span><i style="border-color:var(--g2)"></i>Si seguís así</span><span><i class="bd"></i>Rango probable</span>${meta?'<span><i style="border-color:var(--mu);border-top-style:dotted"></i>Tu meta</span>':''}<span><i style="border-color:#f59e0b;border-top-style:dashed"></i>Plan Copiloto</span></div>
${meta?`<div class="row" style="margin-top:12px;align-items:flex-start"><span>🎯 <b>${Math.round(B.pr[H]*100)}%</b> de chances de sostener tu meta de ${fmt(meta)} por semana durante ${lb}</span></div>`:`<button class="btn sm" data-a="meditor" style="margin-top:12px">Definir mi meta semanal</button>`}
${M.fm>0?`<div class="mu" style="margin-top:8px">🧾 Ya descontamos tus gastos fijos (${fmt(M.fm)} por mes).</div>`:`<div class="mu" style="margin-top:8px">🧾 No cargaste gastos fijos, así que la proyección puede estar algo alta. <button class="lnk" style="width:auto;padding:0;font-size:12px" data-a="go:fixed">Cargarlos</button></div>`}</div>
<div class="amb"><b class="pl">💡 Con el plan del Copiloto</b><div class="big" style="font-size:28px;margin-top:4px">${fmt(P.p50[H])}</div><p>${dl>=0?'+':'−'}${fmt(Math.abs(dl))} respecto de seguir igual, en ${lb}.${dl<0?' Pero con menos días de trabajo.':''}</p></div>
<h2>Te conviene</h2><div class="card w"><p style="margin:0 0 4px">${mc}:</p>
<div class="rr"><div class="ic">📅</div><div><b>Trabajar ${R.D.map(d=>DNL[d].slice(0,3)).join(' · ')}</b><div class="mu">${R.k} días por semana (hoy trabajás ~${String(Math.round(R.kU*10)/10).replace('.',',')})</div></div></div>
<div class="rr"><div class="ic">⏱️</div><div><b>${hs} h por día</b><div class="mu">${String(Math.round(R.k*R.h*10)/10).replace('.',',')} h por semana${R.pi2!=null?'':''}</div></div></div>
${R.zs?`<div class="rr"><div class="ic">📍</div><div><b>${R.zs.map(z=>esc(z.n)).join(', ')}</b><div class="mu">Franja fuerte: ${PARTS[R.pi1][1]} h (${PARTS[R.pi1][0].toLowerCase()})${R.pi2!=null?' · segunda: '+PARTS[R.pi2][1]+' h':''}</div></div></div>`:`<div class="rr"><div class="ic">📍</div><div><b>Zona</b><div class="mu">Por ahora solo cubrimos el AMBA.</div></div></div>`}
${appRow(R)}
<p style="margin:8px 0 0">Con esto estimamos <b style="color:var(--tx)">${fmt(R.pl)}</b> netos por semana, contra <b style="color:var(--tx)">${fmt(R.cw)}</b> si seguís igual${meta?' (tu meta: '+fmt(meta)+')':''}.</p>
${R.reach?'':`<p style="margin-top:6px;color:#b45309"><b>Ojo:</b> con tu ritmo actual, llegar a tu meta pediría unas ${Math.round(R.hn)} horas por semana. Este es el plan más sano que alcanzamos; quizá te convenga ajustar la meta a ~${fmt(Math.floor(R.pl/1000)*1000)}.</p>`}
${R.zs?'<button class="btn s" data-a="cmap">🗺️ Ver zonas en el mapa</button>':''}</div>
<div class="card w"><b>Cuánto rinde cada día (por jornada)</b>${bars2(M.mu,DNS,R.D)}<div class="mu">En verde, los días del plan.</div><ul class="ins">${ins.map(t=>`<li>${t}</li>`).join('')}</ul></div>
<div class="mu" style="margin:0 2px 10px">Confianza <b>${M.conf}</b> · se basa en ${M.n} jornadas tuyas de las últimas ${String(M.wks).replace('.',',')} semanas y en el patrón de riders parecidos. Son estimaciones, no promesas.</div>
<button class="lnk" data-a="cophow">${s.how?'Ocultar cómo lo calculamos ▴':'¿Cómo lo calculamos? ▾'}</button>
${s.how?`<div class="card w how"><b>Lo que hace el Copiloto por detrás</b><ol><li>Mira tus días y le da más peso a lo reciente.</li><li>Aprende cuánto rinde cada día de la semana y con qué frecuencia lo trabajás: no usa un promedio plano.</li><li>Cuando tenés pocos datos, los completa con el patrón de riders parecidos. <b>Hoy esos valores son una referencia inicial</b> que se va a reemplazar por los datos reales del piloto.</li><li>Tus gastos fijos se descuentan aparte, para que un mes de seguro no arruine un día.</li><li>Simula 1.200 semanas posibles, con días buenos, malos y de descanso, y por eso te muestra un rango en vez de un solo número.</li><li>Los montos están en pesos de hoy: no incluyen inflación.</li><li>La zona sale del patrón general de tu zona y tu vehículo, no de tus recorridos.</li></ol></div>`:''}</div>`},
map:()=>{const dw=s.mapDow==null?WK(today):s.mapDow,pi=s.mapPart==null?nowPart():s.mapPart,rk=zoneRanks(dw,pi),sel=s.mz&&rk.find(o=>o.z.id==s.mz),mine=GR.indexOf(s.zona);
 let card;if(sel){const z=sel.z,bp=[0,1,2,3,4].sort((a,b)=>dem(z,dw,b)-dem(z,dw,a))[0];card=`<div class="card w"><div class="row"><b style="font-size:16px">${esc(z.n)}</b><button class="lnk" style="width:auto;padding:0" data-a="zsel:">✕</button></div><div class="row" style="margin-top:6px"><span class="tag">Demanda ${lvl(sel.idx).toLowerCase()} · ${sel.idx}/100</span>${z.g==mine?'<span class="tag">Tu zona</span>':''}</div><p>Mejor franja ese día: <b style="color:var(--tx)">${PARTS[bp][1]} h</b> (${PARTS[bp][0].toLowerCase()}).${z.sat>=.6?' Suele haber mucha competencia entre riders.':z.sat<=.3?' Con poca competencia entre riders.':''}</p></div>`}
 else card=`<div class="card w"><b>Mejores zonas · ${DNL[dw]}, ${PARTS[pi][0].toLowerCase()}</b>${rk.slice(0,3).map(o=>`<div class="zrow" data-a="zsel:${o.z.id}"><span class="rk">${o.rank}</span><div>${esc(o.z.n)}<div class="mu">${lvl(o.idx)} · ${o.idx}/100${o.z.g==mine?' · tu zona':''}</div></div><span class="mu">›</span></div>`).join('')}</div>`;
 return `<div class="scr"><div class="row"><h1>Mapa</h1><span class="tag">Estimación inicial</span></div><p>Dónde hay más demanda en el AMBA según el día y la franja.</p>
<div class="hscroll" style="margin-top:10px">${DNS.map((d,i)=>`<button class="chip ${dw==i?'on':''}" data-a="mdw:${i}">${d}</button>`).join('')}</div>
<div class="hscroll">${PARTS.map((p,i)=>`<button class="chip ${pi==i?'on':''}" data-a="mpt:${i}">${p[0]}</button>`).join('')}</div>
<div class="mapbox" id="mapHost"></div><div class="ramp"></div><div class="row mu" style="margin-bottom:10px"><span>Menos demanda</span><span>Más demanda</span></div>${card}
<p class="mu" style="margin-top:4px">Los círculos son zonas aproximadas y la demanda es una estimación inicial: se va a ir afinando con los datos de los riders de CoPi.</p></div>`},
me:()=>{const R=(i,x,d,a)=>`<div class="card w row" data-a="${a}" style="cursor:pointer"><span>${i} <b>${x}</b><div class="mu">${d}</div></span>›</div>`;
 return `<div class="scr"><div class="row"><h1>Perfil</h1>${mas('hello',70)}</div><div class="card"><b>${esc(s.fullname||s.name)}</b><p>${esc(s.work)}${s.veh?' · '+esc(s.veh):''} · ${esc(s.apps.join(', ')||'—')}${s.zona?' · '+esc(s.zona):''}</p></div>
${R('👤','Mis datos','Nombre y correo','go:p_data')}${R('🛵','Mi trabajo','Tipo, apps, vehículo y zona','pwork')}${R('🎯','Mi meta',s.meta?'Meta semanal: '+fmt(s.meta):'Todavía no definiste una meta','pgoal')}${R('🗓️','Gastos fijos mensuales',fxPend().length?'Tenés montos para revisar este mes':'Seguro, monotributo, alquiler, celular','go:fixed')}${R('⏱️','Mis jornadas','Esta semana: '+hrs(),'go:shifts')}${R('🔒','Mis datos y privacidad','Uso anónimo y borrado de cuenta','go:p_priv')}
<div class="card w row"><div><b>Horas esta semana</b><div class="mu">${hrs()}${s.since?' (en curso)':''}</div></div><button class="btn sm ${s.since?'r':''}" data-a="clock">${s.since?'Terminé':'Empecé a trabajar'}</button></div>
